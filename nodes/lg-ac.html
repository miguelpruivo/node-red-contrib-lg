<script type="text/javascript">
  (function () {
    // Fill an AC device <select> from the account admin endpoint. A per-select
    // token makes overlapping/repeated calls safe (stale responses are ignored),
    // and devices are de-duplicated by id, so options never accumulate.
    window.lgAcLoadDevices = function (selectId, statusId, savedValue) {
      var accId = $('#node-input-account').val();
      var sel = $('#' + selectId);
      var statusEl = statusId ? $('#' + statusId) : null;

      var token = (parseInt(sel.attr('data-load-token') || '0', 10) + 1);
      sel.attr('data-load-token', token);
      function isStale() { return String(sel.attr('data-load-token')) !== String(token); }

      function fill(options, selectValue) {
        sel.empty();
        options.forEach(function (o) {
          sel.append($('<option></option>').val(o.id).text(o.label));
        });
        if (selectValue) { sel.val(selectValue); }
      }

      if (!accId || accId === '_ADD_') {
        fill([{ id: savedValue || '', label: savedValue ? '(saved) ' + savedValue : 'Select an account first' }], savedValue);
        return;
      }

      if (statusEl) { statusEl.css('color', '#777').text('Loading devices...'); }
      $.getJSON('lg-account/' + accId + '/devices')
        .done(function (devices) {
          if (isStale()) { return; }
          var seen = {};
          var acs = (devices || []).filter(function (d) {
            if (d.type !== 401 || seen[d.id]) { return false; }
            seen[d.id] = true;
            return true;
          });
          var options;
          if (!acs.length) {
            options = [{ id: savedValue || '', label: 'No air conditioners found' }];
          } else {
            options = acs.map(function (d) {
              return { id: d.id, label: d.name + (d.online ? '' : ' (offline)') };
            });
            if (savedValue && !seen[savedValue]) {
              options.push({ id: savedValue, label: '(saved) ' + savedValue });
            }
          }
          fill(options, savedValue);
          if (statusEl) { statusEl.text(''); }
        })
        .fail(function (xhr) {
          if (isStale()) { return; }
          var err = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText;
          fill([{ id: savedValue || '', label: savedValue ? '(saved) ' + savedValue : 'Could not load' }], savedValue);
          if (statusEl) { statusEl.css('color', '#a94442').text(err); }
        });
    };
  })();

  RED.nodes.registerType('lg-ac', {
    category: 'LG',
    color: '#a6bbcf',
    defaults: {
      name: { value: '' },
      account: { value: '', type: 'lg-account', required: true },
      deviceId: { value: '' },
      emitPeriodic: { value: true },
      emitOnChange: { value: true },
      includeRaw: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-snowflake-o',
    label: function () {
      return this.name || 'LG AC';
    },
    oneditprepare: function () {
      var savedValue = this.deviceId;
      window.lgAcLoadDevices('node-input-deviceId', 'lg-ac-devstatus', savedValue);
      $('#node-input-account').on('change', function () {
        window.lgAcLoadDevices('node-input-deviceId', 'lg-ac-devstatus', savedValue);
      });
    }
  });
</script>

<script type="text/html" data-template-name="lg-ac">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-account"><i class="fa fa-user"></i> Account</label>
    <input type="text" id="node-input-account">
  </div>
  <div class="form-row">
    <label for="node-input-deviceId"><i class="fa fa-snowflake-o"></i> AC</label>
    <select id="node-input-deviceId" style="width:70%"></select>
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <span id="lg-ac-devstatus" style="color:#999;"></span>
  </div>
  <hr/>
  <div class="form-row">
    <label for="node-input-emitPeriodic"><i class="fa fa-clock-o"></i> Periodic</label>
    <input type="checkbox" id="node-input-emitPeriodic" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Emit on every poll (reports temperature even while off)</span>
  </div>
  <div class="form-row">
    <label for="node-input-emitOnChange"><i class="fa fa-bolt"></i> On change</label>
    <input type="checkbox" id="node-input-emitOnChange" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Emit immediately when the AC turns on/off or changes</span>
  </div>
  <div class="form-row">
    <label for="node-input-includeRaw"><i class="fa fa-code"></i> Raw</label>
    <input type="checkbox" id="node-input-includeRaw" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Include the raw airState snapshot in msg.raw</span>
  </div>
</script>

<script type="text/html" data-help-name="lg-ac">
  <p>Control <b>and</b> monitor an LG ThinQ air conditioner with a single node.
  Send commands on the input; the current state is emitted on the output after
  each command and on every poll cycle (so temperature is reported even while
  the AC is off).</p>

  <h3>Input (commands)</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">bool | string | number | object</span></dt>
    <dd>
      <ul>
        <li><code>true</code> / <code>"on"</code> — turn on</li>
        <li><code>false</code> / <code>"off"</code> — turn off</li>
        <li><code>"status"</code> — read the current state now</li>
        <li>a number, e.g. <code>22</code> — set target temperature</li>
        <li>a mode name: <code>"cool"</code>, <code>"heat"</code>, <code>"fan"</code>, <code>"dry"</code>, <code>"auto"</code></li>
        <li>an object: <code>{ "power": true, "mode": "COOL", "temperature": 22, "fan": "HIGH" }</code></li>
        <li>vane direction: <code>{ "verticalVane": 1, "horizontalVane": 1 }</code>
            (1 = top/left … higher = down/right, <code>"swing"</code> = sweep, <code>"off"</code> = stop; valid positions vary by model)</li>
        <li>swing shorthand: <code>{ "swing": "both" }</code> (or <code>"vertical"</code> / <code>"horizontal"</code> / <code>"off"</code>)</li>
        <li>raw escape hatch: <code>{ "raw": { "airState.wDir.vStep": 1 } }</code> for any key this node doesn't model</li>
      </ul>
      Changing mode/temperature/fan while the AC is off turns it on first;
      turning it off ignores any other settings in the same message.
    </dd>
    <dt class="optional">deviceId<span class="property-type">string</span></dt>
    <dd>Overrides the configured AC for this message.</dd>
  </dl>

  <h3>Output (status + results)</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">object</span></dt>
    <dd><code>power</code>, <code>mode</code>, <code>currentTemperature</code>,
        <code>targetTemperature</code>, <code>fanSpeed</code>,
        <code>humidity</code>, <code>verticalVane</code>, <code>horizontalVane</code>,
        <code>online</code>.</dd>
    <dt>event<span class="property-type">string</span></dt>
    <dd><code>initial</code> / <code>change</code> / <code>periodic</code> (from polling),
        <code>command</code> (after a control), <code>query</code> (after a "status" request).</dd>
    <dt>changed<span class="property-type">array</span></dt>
    <dd>Which fields changed (for poll-driven messages).</dd>
    <dt>deviceId / topic<span class="property-type">string</span></dt>
    <dd>The AC device id.</dd>
  </dl>

  <h3>Options</h3>
  <ul>
    <li><b>Periodic</b> — emit on every poll cycle (interval is set on the account node).</li>
    <li><b>On change</b> — emit as soon as something changes.</li>
    <li>Disable both to only emit responses to commands you send.</li>
  </ul>
</script>
