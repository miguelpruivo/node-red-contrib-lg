<script type="text/javascript">
  RED.nodes.registerType('lg-tv-status', {
    category: 'LG',
    color: '#a6bbcf',
    defaults: {
      name: { value: '' },
      tv: { value: '', type: 'lg-tv', required: true },
      emitInitial: { value: true }
    },
    inputs: 0,
    outputs: 1,
    icon: 'font-awesome/fa-television',
    label: function () {
      return this.name || 'LG TV status';
    }
  });
</script>

<script type="text/html" data-template-name="lg-tv-status">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-tv"><i class="fa fa-television"></i> TV</label>
    <input type="text" id="node-input-tv">
  </div>
  <div class="form-row">
    <label for="node-input-emitInitial"><i class="fa fa-play"></i> Initial</label>
    <input type="checkbox" id="node-input-emitInitial" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Emit the current state once when deployed</span>
  </div>
</script>

<script type="text/html" data-help-name="lg-tv-status">
  <p>Emits a message whenever an LG webOS TV turns on or off.</p>

  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">object</span></dt>
    <dd><code>{ power: boolean, state: string, connected: boolean }</code>.
        <code>state</code> is the detailed webOS label (e.g. <code>On</code>,
        <code>Off</code>, <code>Pixel Refresher</code>).</dd>
    <dt>event<span class="property-type">string</span></dt>
    <dd><code>on</code> or <code>off</code>.</dd>
    <dt>topic<span class="property-type">string</span></dt>
    <dd>The TV name.</dd>
  </dl>

  <p>Detection uses the webOS power-state subscription when available and falls
  back to the websocket connection state for older TVs.</p>
</script>
