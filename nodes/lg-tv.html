<script type="text/javascript">
  RED.nodes.registerType('lg-tv', {
    category: 'LG',
    color: '#a6bbcf',
    defaults: {
      name: { value: '' },
      host: { value: '', required: true },
      mac: { value: '' },
      broadcast: { value: '255.255.255.255' },
      secure: { value: false },
      reconnect: { value: 5, validate: RED.validators.number() },
      action: { value: 'msg' },
      emitInitial: { value: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-television',
    label: function () {
      var a = this.action && this.action !== 'msg' ? ' (' + this.action + ')' : '';
      return this.name || ('LG TV' + a);
    },
    oneditprepare: function () {
      // Backfill the default for nodes created before the field existed.
      var rc = $('#node-input-reconnect');
      if (!rc.val()) {
        rc.val(5);
      }
    }
  });
</script>

<script type="text/html" data-template-name="lg-tv">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="e.g. Living room TV">
  </div>
  <div class="form-row">
    <label for="node-input-host"><i class="fa fa-television"></i> IP address</label>
    <input type="text" id="node-input-host" placeholder="e.g. 192.168.1.50">
  </div>
  <div class="form-row">
    <label for="node-input-mac"><i class="fa fa-ethernet"></i> MAC</label>
    <input type="text" id="node-input-mac" placeholder="AA:BB:CC:DD:EE:FF (needed to turn on)">
  </div>
  <div class="form-row">
    <label for="node-input-broadcast"><i class="fa fa-rss"></i> Broadcast</label>
    <input type="text" id="node-input-broadcast" placeholder="255.255.255.255" style="width:160px">
  </div>
  <div class="form-row">
    <label for="node-input-reconnect"><i class="fa fa-refresh"></i> Reconnect</label>
    <input type="number" id="node-input-reconnect" min="1" style="width:80px"> seconds
    <span style="color:#999; margin-left:8px;">Retry interval while the TV is off (how fast turn-on is detected)</span>
  </div>
  <div class="form-row">
    <label for="node-input-secure"><i class="fa fa-lock"></i> Secure</label>
    <input type="checkbox" id="node-input-secure" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Which transport to try first. Auto-detected &mdash; if the TV refuses one the node switches to the other and stays on whichever pairs, so normally leave this off.</span>
  </div>
  <hr/>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-bolt"></i> Action</label>
    <select id="node-input-action" style="width:200px">
      <option value="msg">From msg.payload</option>
      <option value="on">Always turn on</option>
      <option value="off">Always turn off</option>
      <option value="toggle">Toggle</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-emitInitial"><i class="fa fa-play"></i> Initial</label>
    <input type="checkbox" id="node-input-emitInitial" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:#999;">Emit the current power state once when deployed</span>
  </div>
</script>

<script type="text/html" data-help-name="lg-tv">
  <p>Control <b>and</b> monitor an LG webOS TV with a single node. Send a command
  on the input; on/off changes are emitted on the output as they happen.</p>

  <h3>Setup</h3>
  <ol>
    <li>Give the TV a static IP and enter it as <b>IP address</b>.</li>
    <li>Enter the TV's <b>MAC</b> — required for Wake-on-LAN (turning it on).</li>
    <li>On the TV enable <i>Settings → General → Mobile TV On</i> so Wake-on-LAN works.</li>
    <li>On first connection the TV shows a <b>pairing prompt</b> — accept it once.
        The pairing key is stored under <code>&lt;userDir&gt;/node-red-contrib-lg/</code>.</li>
    <li>If the connection fails with a reset error, enable <b>Secure</b>.</li>
  </ol>

  <h3>Input (commands)</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">bool | string | object</span></dt>
    <dd>When Action is "From msg.payload": <code>true</code>/<code>"on"</code>,
        <code>false</code>/<code>"off"</code>, or <code>"toggle"</code>.</dd>
  </dl>

  <h4>Picture settings</h4>
  <p>Requires the TV to be <b>on</b>.</p>
  <ul>
    <li><code>{ "brightness": 40 }</code> &mdash; OLED Pixel Brightness (0&ndash;100).</li>
    <li><code>{ "reduceBlueLight": true }</code> &mdash; the "Reduce Blue Light" toggle.</li>
    <li><code>{ "pictureMode": "cinema" }</code> &mdash; picture preset.</li>
    <li><code>{ "picture": { "backlight": 40, "eyeComfortMode": "on" } }</code> &mdash;
        any picture setting, verbatim.</li>
  </ul>
  <p>Several can be combined in one message &mdash;
  <code>{ "brightness": 90, "reduceBlueLight": false }</code> is applied as a single write.
  Keys inside <code>picture</code> override the shorthands above.</p>
  <p>Brightness is stored <b>per picture preset</b> (and separately for SDR/HDR), so set
  <code>pictureMode</code> in the same message when it has to be deterministic. Energy
  Saving can clamp or override the value. Note that the picture category's own
  <code>brightness</code> key is Black Level, not the panel light &mdash; that is why
  <code>{ "brightness": n }</code> maps to <code>backlight</code>.</p>

  <h4>Raw escape hatches</h4>
  <ul>
    <li><code>{ "request": "ssap://settings/getSystemSettings",
        "params": { "category": "picture", "keys": ["backlight"] } }</code> &mdash;
        any SSAP call; the response becomes <code>msg.payload</code>.</li>
    <li><code>{ "luna": "luna://com.webos.settingsservice/setSystemSettings",
        "params": { "category": "picture", "settings": { "backlight": 40 } } }</code> &mdash;
        any luna service call.</li>
  </ul>
  <p>Settings writes have to go through <code>luna</code>: LG refuses
  <code>ssap://settings/setSystemSettings</code> from third-party clients, so the node
  smuggles the call through a system alert. A brief alert may flash on screen.
  Needs webOS 4 or newer.</p>

  <h3>Output (status)</h3>
  <dl class="message-properties">
    <dt>payload<span class="property-type">object</span></dt>
    <dd><code>{ power: boolean, state: string, connected: boolean }</code>.
        <code>state</code> is the detailed webOS label (e.g. <code>On</code>, <code>Off</code>).</dd>
    <dd>After a picture-settings command:
        <code>{ ok: true, settings: { &hellip; }, actual: { &hellip; } }</code> &mdash;
        <code>settings</code> is what was sent, <code>actual</code> is what the TV holds
        when read straight back (<code>null</code> if the read-back failed). If the two
        differ the node also logs a warning: a write can be clamped (Energy Saving) or land
        in another preset / SDR-HDR slot, and without the read-back that is invisible.</dd>
    <dt>event<span class="property-type">string</span></dt>
    <dd><code>on</code> / <code>off</code> (status change) or <code>command</code> (after a control).</dd>
    <dt>topic<span class="property-type">string</span></dt>
    <dd>The TV name.</dd>
  </dl>

  <h3>Detection speed</h3>
  <p>While the TV is on, a power-off is detected almost immediately. While the TV is
  off, the node retries connecting every <b>Reconnect</b> seconds, so a turn-on
  is detected within that interval. Brief network drops are ridden out: the node
  waits a few seconds for the connection to come back before reporting the TV off,
  so a Wi-Fi hiccup does not flap the state off/on.</p>
</script>
